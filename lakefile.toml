name = "WeaklyConvexLowerBound"
version = "1.0.0"
keywords = ["math", "optimization", "weak-convexity", "lower-bound"]
defaultTargets = ["WeaklyConvexLowerBound"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "11d11a11a667a8fa8ea19d9456fe059f683e308f"

[[lean_lib]]
name = "WeaklyConvexLowerBound"
