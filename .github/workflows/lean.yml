name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1

      - name: Run package hygiene and axiom audit
        shell: pwsh
        run: ./VERIFY.ps1
